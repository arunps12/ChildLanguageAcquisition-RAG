# ChildLanguageNet RAG — Configuration
# This file is committed to git. No secrets here.
# Override any value with an environment variable of the same name (UPPER_CASE).
# Set OPENAI_API_KEY in your .env file.

[llm]
provider = "openai"
model = "openai:gpt-4o"
temperature = 0.2
max_tokens = 1024

[embeddings]
provider = "openai"
model = "text-embedding-3-small"
batch_size = 64
use_local = false                       # true = sentence-transformers (CPU)

[chunking]
chunk_size = 500
chunk_overlap = 50

[retrieval]
default_top_k = 8

[ui]
title = "Child Language Research RAG"
max_sources_display = 10

[telemetry]
log_level = "INFO"
metrics_enabled = true

[misc]
user_agent = "childlanguagenet-rag/0.2 (research)"
