[project]
name = "childlanguageacquisition-rag"
version = "0.2.0"
description = "RAG-based document search and Q&A for child language acquisition research literature."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "dvc>=3.0",
    "faiss-cpu>=1.7",
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-core>=0.2",
    "langchain-ollama>=1.0",
    "langgraph>=0.2",
    "pydantic>=2.0",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
local-embeddings = [
    "sentence-transformers>=3.0",
]
openai = [
    "langchain-openai>=0.1",
    "openai>=1.0",
]

[project.scripts]
childrag = "childlanguagenet.cli:main"
childrag-index = "childlanguagenet.cli:build_index"
childrag-serve = "childlanguagenet.cli:serve_streamlit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/childlanguagenet"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
