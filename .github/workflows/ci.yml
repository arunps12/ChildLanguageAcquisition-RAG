name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv and sync deps
        run: |
          uv venv
          uv sync --all-extras

      - name: Lint (ruff)
        run: |
          source .venv/bin/activate
          ruff check src/ tests/

      - name: Tests (pytest)
        run: |
          source .venv/bin/activate
          pytest tests/ -v

      - name: Build Docker image
        run: docker build -t childlanguagenet-rag:ci .
